name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_CLI_UI_LANGUAGE: en
  CI: "true"

jobs:
  build:
    name: source build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup .NET SDK from global.json
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore locked dependencies
        run: dotnet restore PA.Router.sln --locked-mode
      - name: Build Release
        run: dotnet build PA.Router.sln -c Release --no-restore
      - name: CLI help
        run: dotnet run --project src/PA.Router.Cli -c Release --no-build -- --help